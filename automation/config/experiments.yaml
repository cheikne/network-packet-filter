# Experiment plan, read by automation/run_experiment.py.

duration: 60       # seconds per run
repetitions: 10    # runs per configuration and scenario

# Configuration name -> policy name.
# The policy is the file policies/<policy>.nft (Role 3), loaded with
# automation/apply_policy.sh. Policy names are proposals: Role 3 can rename them.
configurations:
  baseline: baseline
  p1: p1_basic
  p2: p2_stateful
  p3_low: p3_low
  p3_med: p3_med
  p3_high: p3_high
  p4: p4

# Scenario name -> traffic commands. All commands of a scenario start at the
# same time. Each command has:
#   node: legit or susp
#   cmd:  shell command run inside that node. Placeholders:
#         {target}   server IP (10.0.2.10)
#         {duration} run duration in seconds
#         {output}   folder for this command's logs (inside the node)
# Role 2 fills these in, for example:
#   cmd: "python3 /project/traffic/legitimate/http.py --target {target} --duration {duration} --output {output}"
scenarios:
  A:
    - node: legit
      cmd: "python3 /project/traffic/legitimate/http_traffic.py --target {target} --duration {duration} --rate 20 --output {output}"
    - node: legit
      cmd: "python3 /project/traffic/legitimate/dns.py --target {target} --duration {duration} --rate 10 --output {output}"
    - node: legit
      cmd: "python3 /project/traffic/legitimate/ssh.py --target {target} --duration {duration} --rate 1 --output {output}"
    - node: legit
      cmd: "python3 /project/traffic/legitimate/download.py --target {target} --duration {duration} --output {output}"

  B-synscan:
    - node: susp
      cmd: "python3 /project/traffic/suspicious/scan.py --type syn --target {target} --duration {duration} --output {output}"

  B-nullscan:
    - node: susp
      cmd: "python3 /project/traffic/suspicious/scan.py --type null --target {target} --duration {duration} --output {output}"

  B-finscan:
    - node: susp
      cmd: "python3 /project/traffic/suspicious/scan.py --type fin --target {target} --duration {duration} --output {output}"

  B-xmasscan:
    - node: susp
      cmd: "python3 /project/traffic/suspicious/scan.py --type xmas --target {target} --duration {duration} --output {output}"

  B-synflood:
    - node: susp
      cmd: "python3 /project/traffic/suspicious/synflood.py --target {target} --duration {duration} --rate 20 --output {output}"

  B-sshbrute:
    - node: susp
      cmd: "python3 /project/traffic/suspicious/sshbrute.py --target {target} --duration {duration} --rate 5 --output {output}"

  C:
    - node: legit
      cmd: "python3 /project/traffic/legitimate/http_traffic.py --target {target} --duration {duration} --rate 20 --output {output}"
    - node: legit
      cmd: "python3 /project/traffic/legitimate/dns.py --target {target} --duration {duration} --rate 10 --output {output}"
    - node: legit
      cmd: "python3 /project/traffic/legitimate/ssh.py --target {target} --duration {duration} --rate 1 --output {output}"
    - node: susp
      cmd: "python3 /project/traffic/suspicious/scan.py --type syn --target {target} --duration {duration} --output {output}"
    - node: susp
      cmd: "python3 /project/traffic/suspicious/sshbrute.py --target {target} --duration {duration} --rate 5 --output {output}"