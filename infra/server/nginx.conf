# Lab web server: HTTP on 80, HTTPS on 443 (self-signed certificate)
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/ssl/certs/lab.crt;
    ssl_certificate_key /etc/ssl/private/lab.key;

    root /var/www/html;
    index index.html;

    access_log /var/log/lab/nginx_access.log;
    error_log  /var/log/lab/nginx_error.log;
}
